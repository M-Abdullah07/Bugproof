[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bugproof"
version = "0.1.0"
description = "Human-approved, evidence-backed support handoffs"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bugproof = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --basetemp=.tools/pytest-tmp"
markers = ["live: explicit opt-in checks using real owned accounts and deployment"]
